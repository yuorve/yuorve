<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEV_REX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #02080f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }

  .banner {
    width: 900px;
    height: 450px;
    background: radial-gradient(ellipse at 25% 70%, #0b2418 0%, #030d18 55%, #020810 100%);
    border: 2px solid #00ff88;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 60px #00ff8833, 0 0 120px #00ff8811, inset 0 0 80px #00000088;
  }

  /* Matrix rain */
  .matrix-bg {
    position: absolute; top: 0; right: 0;
    width: 62%; height: 100%;
    opacity: 0.12; overflow: hidden; pointer-events: none;
  }
  .matrix-col {
    position: absolute; top: -100%;
    color: #00ff88; font-size: 12px; line-height: 16px;
    animation: matrixFall linear infinite;
    white-space: nowrap; writing-mode: vertical-rl;
    text-orientation: upright; letter-spacing: 3px;
  }
  @keyframes matrixFall {
    0%   { top: -100%; opacity: 1; }
    85%  { opacity: 1; }
    100% { top: 115%;  opacity: 0; }
  }

  /* Circuit SVG */
  .circuit { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }

  /* Ground glow */
  .ground-glow {
    position: absolute; bottom: 4px; left: 0px;
    width: 360px; height: 30px;
    background: radial-gradient(ellipse, #00ff8855 0%, transparent 70%);
    border-radius: 50%;
    animation: groundPulse 2.8s ease-in-out infinite;
  }
  @keyframes groundPulse {
    0%,100% { transform: scaleX(1);    opacity: .55; }
    50%      { transform: scaleX(1.12); opacity: 1; }
  }

  /* Dino */
  .dino-wrap {
    position: absolute;
    left: -10px; bottom: -5px;
    width: 350px; height: 380px;
    animation: dinoFloat 3.4s ease-in-out infinite;
    transform-origin: center bottom;
  }
  .dino-img {
    width: 100%; height: 100%;
    object-fit: contain;
    filter:
      drop-shadow(0 0 18px #00ff8877)
      drop-shadow(0 0 45px #00ff8833)
      drop-shadow(0 6px 12px #00000088);
  }
  @keyframes dinoFloat {
    0%,100% { transform: translateY(0px)   rotate(-.6deg); }
    50%      { transform: translateY(-12px) rotate(.6deg); }
  }

  /* Particles */
  .particles {
    position: absolute;
    left: 265px; top: 44%;
    transform: translateY(-50%);
    width: 360px; height: 180px;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    color: #00ffcc; font-size: 11px; font-weight: bold;
    text-shadow: 0 0 9px #00ffccaa;
    animation: flyCode linear infinite;
    white-space: nowrap; opacity: 0;
  }
  @keyframes flyCode {
    0%   { left: 0;    opacity: 0; transform: scale(.5) rotate(-5deg); }
    12%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { left: 100%; opacity: 0; transform: scale(1.1) rotate(5deg); }
  }

  /* Code window */
  .code-window {
    position: absolute; right: 26px; top: 20px;
    width: 248px;
    background: rgba(1,8,18,.94);
    border: 1.5px solid #00ff88; border-radius: 8px;
    box-shadow: 0 0 24px #00ff8855, 0 0 55px #00ff8820;
    animation: winPulse 4.5s ease-in-out infinite;
    overflow: hidden;
  }
  @keyframes winPulse {
    0%,100% { box-shadow: 0 0 24px #00ff8855, 0 0 55px #00ff8820; }
    50%      { box-shadow: 0 0 38px #00ff88bb, 0 0 80px #00ff8844; }
  }
  .win-bar {
    background: #00ff88; padding: 5px 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .win-title { color:#020d10; font-size:9.5px; font-weight:900; letter-spacing:2.5px; }
  .win-dots  { display:flex; gap:4px; }
  .win-dot   { width:8px; height:8px; border-radius:50%; background:#020d10; opacity:.4; }
  .code-body { padding:9px 11px; font-size:9.5px; line-height:17px; color:#556; }
  .kw  { color:#d988ff; }
  .fn  { color:#00ccff; }
  .str { color:#ffcc44; }
  .cm  { color:#00ff88; }
  .op  { color:#ff6688; }
  .cursor {
    display:inline-block; background:#00ff88;
    width:6px; height:10px;
    animation: blink 1s step-end infinite; vertical-align:middle;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Title */
  .title-block {
    position: absolute; right: 26px; bottom: 92px;
    text-align: right;
  }
  .main-title {
    font-size: 60px; font-weight: 900; letter-spacing: 4px;
    color: #00ff88; line-height: 1;
    animation: titleGlow 2.4s ease-in-out infinite alternate;
  }
  @keyframes titleGlow {
    from { text-shadow: 0 0 16px #00ff88, 0 0 32px #00ff8855; }
    to   { text-shadow: 0 0 30px #00ff88, 0 0 60px #00ff88aa, 0 0 100px #00ff8833; }
  }
  .banner:hover .main-title {
    animation: titleGlow 2.4s ease-in-out infinite alternate, glitch .28s infinite;
  }
  @keyframes glitch {
    0%  { text-shadow: 0 0 30px #00ff88, -3px 0 #ff0066,  3px 0 #00ccff; }
    33% { text-shadow: 0 0 30px #00ff88,  3px 0 #ff0066, -3px 0 #00ccff; }
    66% { text-shadow: 0 0 30px #00ff88,  0   0 #ff0066,  0   0 #00ccff; }
  }
  .sub-title { color:#eee; font-size:12.5px; font-weight:700; letter-spacing:3px; margin-top:5px; opacity:.88; }
  .git-label { color:#00ccff; font-size:10.5px; letter-spacing:2px; margin-top:4px; text-shadow:0 0 10px #00ccff55; }

  /* Stats */
  .stats { position:absolute; right:26px; bottom:16px; display:flex; gap:24px; }
  .stat  { text-align:center; animation:statPop .5s ease backwards; }
  .stat:nth-child(1){ animation-delay:.3s }
  .stat:nth-child(2){ animation-delay:.5s }
  .stat:nth-child(3){ animation-delay:.7s }
  @keyframes statPop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
  .stat-label { color:#00ccff; font-size:7.5px; letter-spacing:2px; font-weight:700; }
  .stat-value { color:#00ff88; font-size:18px; font-weight:900; text-shadow:0 0 12px #00ff88; }

  /* Scanline */
  .scanline {
    position:absolute; top:0; left:0;
    width:100%; height:2px;
    background: linear-gradient(90deg, transparent, #00ff8828, transparent);
    animation: scanMove 5.5s linear infinite; pointer-events:none;
  }
  @keyframes scanMove { 0%{top:0} 100%{top:100%} }

  /* Corners */
  .corner { position:absolute; width:22px; height:22px; border-color:#00ff88; border-style:solid; }
  .c-tl { top:6px;    left:6px;   border-width:2px 0 0 2px; }
  .c-tr { top:6px;    right:6px;  border-width:2px 2px 0 0; }
  .c-bl { bottom:6px; left:6px;   border-width:0 0 2px 2px; }
  .c-br { bottom:6px; right:6px;  border-width:0 2px 2px 0; }
</style>
</head>
<body>
<div class="banner">

  <div class="corner c-tl"></div>
  <div class="corner c-tr"></div>
  <div class="corner c-bl"></div>
  <div class="corner c-br"></div>

  <div class="matrix-bg" id="matrixBg"></div>

  <svg class="circuit" viewBox="0 0 900 450" opacity=".18">
    <g stroke="#00ff88" stroke-width="1" fill="none">
      <path d="M0 185 L90 185 L90 140 L170 140" stroke-dasharray="6,3"/>
      <path d="M0 300 L70 300 L70 322 L130 322 L130 352" stroke-dasharray="6,3"/>
      <path d="M220 450 L220 375 L268 375" stroke-dasharray="6,3"/>
      <circle cx="90"  cy="140" r="4" fill="#00ff88"/>
      <circle cx="70"  cy="300" r="4" fill="#00ff88"/>
      <circle cx="130" cy="322" r="4" fill="#00ff88"/>
    </g>
  </svg>

  <div class="ground-glow"></div>

  <!-- DINO — original PNG, no flip (already faces left/right correctly) -->
  <div class="dino-wrap">
    <img class="dino-img" src="Gemini_Generated_Image_y64vr3y64vr3y64v-removebg-preview.png" alt="Dev Rex"/>
  </div>

  <div class="particles" id="particles"></div>

  <div class="code-window">
    <div class="win-bar">
      <span class="win-title">CODE SOURCE</span>
      <div class="win-dots"><div class="win-dot"></div><div class="win-dot"></div><div class="win-dot"></div></div>
    </div>
    <div class="code-body">
      <div><span class="cm">DEV_REX</span> {</div>
      <div>&nbsp;&nbsp;<span class="kw">var</span> <span class="fn">function</span>() {</div>
      <div>&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">var</span> commits {</div>
      <div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">return</span> <span class="str">"REFEEDITON"</span>;</div>
      <div>&nbsp;&nbsp;&nbsp;&nbsp;}</div>
      <div>&nbsp;&nbsp;}</div>
      <div>&nbsp;&nbsp;<span class="cm">REFEEDING_ALGORITHM</span></div>
      <div>&nbsp;&nbsp;<span class="op">&lt;/&gt;</span> <span class="fn">contributions</span>;</div>
      <div>&nbsp;&nbsp;<span class="fn">git</span> <span class="str">commit</span>() {</div>
      <div>&nbsp;&nbsp;&nbsp;&nbsp;<span class="op">push</span>(<span class="str">"ROOT"</span>);</div>
      <div>&nbsp;&nbsp;}<span class="cursor"></span></div>
    </div>
  </div>

  <div class="title-block">
    <div class="main-title">DEV_REX</div>
    <div class="sub-title">BUILDING &amp; CONSUMING CODE</div>
    <div class="git-label">GIT COMMIT: REFEEDING_ALGORITHM</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">REPOSITORY</div>
      <div class="stat-value" id="repoCount">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">COMMITS</div>
      <div class="stat-value" id="commitCount">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">CONTRIBUTIONS</div>
      <div class="stat-value" id="contribCount">0</div>
    </div>
  </div>

  <div class="scanline"></div>
</div>

<script>
  const mb = document.getElementById('matrixBg');
  const ch = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ';
  for (let i = 0; i < 32; i++) {
    const c = document.createElement('div');
    c.className = 'matrix-col';
    c.style.left = (i * 3.2) + '%';
    c.style.animationDuration = (4 + Math.random() * 8) + 's';
    c.style.animationDelay   = (Math.random() * 9) + 's';
    let t = '';
    for (let j = 0; j < 40; j++) t += ch[Math.floor(Math.random() * ch.length)];
    c.textContent = t;
    mb.appendChild(c);
  }

  const snippets = ['git push','function()','var {}','</>','$ commit','push origin','repo.init()','git status','npm i','merge()','commit --m','git log','push HEAD'];
  const pe = document.getElementById('particles');
  snippets.forEach((s, i) => {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = s;
    p.style.top = (18 + Math.random() * 64) + '%';
    p.style.animationDuration = (2.2 + Math.random() * 2.2) + 's';
    p.style.animationDelay   = (i * 0.38) + 's';
    p.style.fontSize = (9 + Math.random() * 4) + 'px';
    p.style.color = Math.random() > .5 ? '#00ffcc' : '#aaffdd';
    pe.appendChild(p);
  });

  function count(el, target, sfx, dur) {
    let v = 0, step = target / (dur / 16);
    const t = setInterval(() => {
      v = Math.min(v + step, target);
      el.textContent = Math.floor(v) + sfx;
      if (v >= target) clearInterval(t);
    }, 16);
  }
  setTimeout(() => {
    count(document.getElementById('repoCount'),   47,  '', 1200);
    count(document.getElementById('commitCount'), 1200,'', 1500);
    count(document.getElementById('contribCount'),365, '+',1800);
  }, 600);
</script>
</body>
</html>
